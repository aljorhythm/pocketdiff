name: Publish to npm

# Publishes the package to npm. Triggered by either:
#   - publishing a GitHub Release (recommended: tag drives the version), or
#   - a manual run from the Actions tab (workflow_dispatch).
#
# The NPM_TOKEN secret lives on the "production" environment, so the job
# declares `environment: production` to read it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
